services:
  - type: web
    name: friend-quiz
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/quiz.db
    disk:
      name: quiz-data
      mountPath: /var/data
      sizeGB: 1
